services:
  bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env
    environment:
      VOICEVOX_URL: http://voicevox:50021
      DATA_DIR: /data
    volumes:
      - bot-data:/data
    depends_on:
      - voicevox

  # ローカル音声認識 (faster-whisper / OpenAI 互換 API)。
  # OpenAI の STT だけ使う場合は .env の COMPOSE_PROFILES を空にすれば起動しない。
  stt:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    profiles: ["local-stt"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:18000:8000" # ホストからのデバッグ用 (外部非公開)
    volumes:
      - hf-cache:/home/ubuntu/.cache/huggingface

  # 日本語音声合成
  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:50021:50021" # ホストからのデバッグ用 (外部非公開)

volumes:
  bot-data:
  hf-cache:
